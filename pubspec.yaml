name: dart_lodge
description: Local-first open-source darts scoring and statistics app for Android, iOS, and web.
version: 1.0.0+0

environment:
  # Dart 3.13 floor: the codegen stack (freezed 4.x, analyzer 14.6+) needs
  # Dart 3.13, and the toolchain is pinned to Flutter 3.47.9 (Dart 3.13.7)
  # locally and in CI. Ships with Flutter 3.47+.
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  
  # Routing
  go_router: ^17.1.0
  
  # Database (drift everywhere: NativeDatabase on mobile/desktop, WasmDatabase on web)
  # sqlite3 3.x bundles the native SQLite library itself via Dart build hooks
  # (native assets) — no sqlite3_flutter_libs, no Android load workaround (#126).
  drift: ^2.34.0
  sqlite3: ^3.3.3
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Utility packages
  uuid: ^4.5.2
  intl: ^0.20.2
  
  # UI components
  google_fonts: ^6.2.0
  fl_chart: ">=0.69.0 <2.0.0"

  # Error monitoring
  # ^10.6.0: 10.x migrated the Android plugin to Flutter's built-in Kotlin
  # support (no Kotlin Gradle Plugin). 9.x still applies KGP, which Flutter
  # 3.47+ warns will fail future builds, and Sentry will not backport the fix.
  # 10.4+ is also back on minSdk 24 (Flutter's default).
  sentry_flutter: ^10.6.0

  # Screen wakelock
  wakelock_plus: ^1.6.0

  # Auto-scorer training-data export (#381): zip the captured frames + sidecars
  # and hand them to the OS share sheet (no photo-library permission needed).
  # No existing dep covers zip archiving or the share sheet.
  # Capped below 4.0.0: capture_io.dart uses the 3.x ZipFileEncoder API
  # (`ZipFileEncoder.STORE`), which archive 4.x removed. Without the cap the
  # `flutter create` re-resolve in CI upgrades to 4.0.9 and the build fails
  # (`Member not found: 'STORE'`). Migrate to the 4.x API in a separate PR.
  archive: ">=3.6.1 <4.0.0"
  # ^13.x: 10.x pins win32 ^5.5.3, conflicting with package_info_plus ^10.1.0's
  # win32 ^6.0.1 (transitive via wakelock_plus).
  share_plus: ^13.1.0

  # Auto-scorer on-device detection (#378). ultralytics_yolo: the first-party
  # YOLO Flutter plugin (mobile only — the YOLOView impl is web-stubbed behind
  # a conditional import).
  # Floor ^0.6.16 = the newest 0.6.x. Every release up to 0.7.x still applies
  # the Kotlin Gradle Plugin behind an `android.builtInKotlin` guard, so the
  # Flutter KGP warning still lists it. 0.7.x is not adopted here: it swaps
  # LiteRT and changes model export/NMS defaults, which needs its own
  # on-device validation.
  ultralytics_yolo: ^0.6.16

  # Settings / preferences
  shared_preferences: ^2.3.4
  # Pinned via caret to match wakelock_plus ^1.6.0's transitive requirement
  # (package_info_plus ^10.0.0). Issue #139 originally proposed ^8.1.4 but
  # that constraint is unsolvable while wakelock_plus stays on 1.6.x.
  package_info_plus: ^10.1.0
  
  # Code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  audioplayers: ^6.7.1

  # Out-of-band auto-scorer model updates (#715). crypto: SHA-256 of the
  # downloaded model bytes (pure Dart, no native). connectivity_plus: gate the
  # silent background download to an unmetered (wifi/ethernet) connection. The
  # download itself uses dart:io HttpClient — no http/dio dependency.
  crypto: ^3.0.0
  connectivity_plus: ^6.1.0

  # Settings "Contact us" row: opens a mailto: draft to the project address.
  # Already in the tree transitively via ultralytics_yolo.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  # One analyzer for the whole codegen stack (analyzer 14). riverpod_generator
  # pins riverpod_annotation exactly, which pins riverpod, so the runtime
  # Riverpod constraints above move in lock-step with it.
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  # Kept on the 2.34 line to match the drift runtime (drift ^2.34.0 above);
  # 2.34.6 is the first 2.34 patch that accepts analyzer 14.
  drift_dev: ^2.34.6
  
  # Linting
  flutter_lints: ^6.0.0

  # Testing (package:test is not a direct dependency: no test imports it, and
  # its releases on analyzer 14 need a newer test_api than flutter_test pins)
  mockito: ^5.8.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_icon.png"
  web:
    generate: true
    image_path: "app_icon.png"
    background_color: "#0D0D0D"
    theme_color: "#0D0D0D"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # Generate gen_l10n localizations (config in l10n.yaml). Output dir
  # lib/l10n/gen/ is gitignored and regenerated by `flutter pub get`.
  generate: true

  # Assets configuration
  assets:
    - assets/images/
    # App typefaces bundled as assets (Space Grotesk 500/600/700, Inter
    # 400/500/600 — exactly the variants AppTextStyles uses). google_fonts
    # prefers a matching bundled asset over the network, so nothing is
    # fetched from fonts.gstatic.com at runtime (Sentry MY-DARTS-N). The
    # OFL licence files ship alongside, as SIL OFL 1.1 requires.
    - assets/fonts/google_fonts/
    # Sound effects (#516): dartHit / dartMiss / bust, played via SoundService.
    - assets/sounds/
    # On-device auto-scorer model (#377/#378). Produced from the trained .pt by
    # deep-darts-probe's dart-train/export_mobile.py — see
    # docs/AUTO_SCORER_ENABLEMENT.md. ~11 MB; loaded via kAutoScorerModelAsset.
    - assets/models/dart_auto_scorer.tflite

